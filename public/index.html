<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepResearch - AI-Powered Research Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 20px;
        }

        .result.active {
            display: block;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .metric-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .analysis {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .sessions-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .session-item {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .session-item:hover {
            background: #f8f9fa;
        }

        .session-item:last-child {
            border-bottom: none;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: 600;
        }

        .tab.active {
            background: white;
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 DeepResearch</h1>
            <p>AI-Powered Academic Research Assistant</p>
        </header>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="showTab('research')">Nueva Investigación</button>
                <button class="tab" onclick="showTab('sessions')">Sesiones</button>
                <button class="tab" onclick="showTab('stats')">Estadísticas</button>
            </div>

            <!-- Tab: Nueva Investigación -->
            <div id="research-tab" class="tab-content active">
                <form id="research-form">
                    <div class="form-group">
                        <label for="query">Consulta de Investigación:</label>
                        <textarea id="query" name="query" placeholder="Ej: ¿Cómo afectará el cambio climático a la agricultura global para 2050?" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="maxIterations">Iteraciones Máximas:</label>
                        <input type="number" id="maxIterations" name="maxIterations" value="5" min="1" max="10">
                    </div>

                    <div class="form-group">
                        <label for="usuario">Usuario:</label>
                        <input type="text" id="usuario" name="usuario" value="admin">
                    </div>

                    <button type="submit">🚀 Iniciar Investigación</button>
                </form>

                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px;">Procesando investigación...</p>
                </div>

                <div id="result" class="result">
                    <h2>Resultados</h2>
                    <div class="metrics">
                        <div class="metric">
                            <div class="metric-value" id="effectiveness">-</div>
                            <div class="metric-label">Efectividad</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value" id="coverage">-</div>
                            <div class="metric-label">Cobertura</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value" id="iterations">-</div>
                            <div class="metric-label">Iteraciones</div>
                        </div>
                    </div>
                    <div class="analysis" id="analysis"></div>
                    <div style="margin-top: 20px;">
                        <button onclick="exportResult('json')">📥 Exportar JSON</button>
                        <button onclick="exportResult('markdown')">📥 Exportar Markdown</button>
                        <button onclick="exportResult('pdf')">📥 Exportar PDF</button>
                    </div>
                </div>

                <div id="error" class="error" style="display: none;"></div>
            </div>

            <!-- Tab: Sesiones -->
            <div id="sessions-tab" class="tab-content">
                <h2>Sesiones Anteriores</h2>
                <div id="sessions-list" class="sessions-list"></div>
            </div>

            <!-- Tab: Estadísticas -->
            <div id="stats-tab" class="tab-content">
                <h2>Estadísticas</h2>
                <div id="statistics" class="metrics"></div>
            </div>
        </div>
    </div>

    <script>
        let currentSessionId = null;

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');

            if (tabName === 'sessions') {
                loadSessions();
            } else if (tabName === 'stats') {
                loadStatistics();
            }
        }

        document.getElementById('research-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                query: formData.get('query'),
                maxIteraciones: parseInt(formData.get('maxIterations')),
                usuario: formData.get('usuario')
            };

            document.getElementById('loading').classList.add('active');
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').style.display = 'none';

            try {
                const response = await fetch('/api/research', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Error desconocido');
                }

                currentSessionId = result.sessionId;
                
                // Polling para obtener resultados
                pollResults(result.sessionId);
            } catch (error) {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            }
        });

        async function pollResults(sessionId) {
            const maxAttempts = 60;
            let attempts = 0;

            const poll = async () => {
                try {
                    const response = await fetch(`/api/research/${sessionId}`);
                    const data = await response.json();

                    if (data.latestResult) {
                        document.getElementById('loading').classList.remove('active');
                        document.getElementById('result').classList.add('active');
                        
                        document.getElementById('effectiveness').textContent = 
                            (data.latestResult.efectividad || 0).toFixed(1) + '%';
                        document.getElementById('coverage').textContent = 
                            ((data.latestResult.cobertura || 0) * 100).toFixed(1) + '%';
                        document.getElementById('iterations').textContent = 
                            data.results.length || 0;
                        document.getElementById('analysis').textContent = 
                            data.latestResult.analisis || 'Sin análisis disponible';
                        
                        return;
                    }

                    attempts++;
                    if (attempts < maxAttempts) {
                        setTimeout(poll, 2000);
                    } else {
                        throw new Error('Timeout esperando resultados');
                    }
                } catch (error) {
                    document.getElementById('loading').classList.remove('active');
                    document.getElementById('error').textContent = error.message;
                    document.getElementById('error').style.display = 'block';
                }
            };

            poll();
        }

        async function loadSessions() {
            try {
                const response = await fetch('/api/sessions');
                const data = await response.json();
                
                const list = document.getElementById('sessions-list');
                if (data.sessions.length === 0) {
                    list.innerHTML = '<p>No hay sesiones disponibles.</p>';
                    return;
                }

                list.innerHTML = data.sessions.map(session => `
                    <div class="session-item" onclick="loadSession('${session.id}')">
                        <strong>${session.query}</strong><br>
                        <small>${new Date(session.created_at).toLocaleString()} - ${session.status}</small>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('sessions-list').innerHTML = 
                    `<div class="error">Error cargando sesiones: ${error.message}</div>`;
            }
        }

        async function loadSession(sessionId) {
            showTab('research');
            currentSessionId = sessionId;
            await pollResults(sessionId);
        }

        async function loadStatistics() {
            try {
                const response = await fetch('/api/statistics');
                const data = await response.json();
                
                const stats = data.statistics;
                document.getElementById('statistics').innerHTML = `
                    <div class="metric">
                        <div class="metric-value">${stats.total_sessions || 0}</div>
                        <div class="metric-label">Total Sesiones</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value">${stats.completed_sessions || 0}</div>
                        <div class="metric-label">Completadas</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value">${(stats.avg_effectiveness || 0).toFixed(1)}%</div>
                        <div class="metric-label">Efectividad Promedio</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value">${(stats.avg_iterations || 0).toFixed(1)}</div>
                        <div class="metric-label">Iteraciones Promedio</div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('statistics').innerHTML = 
                    `<div class="error">Error cargando estadísticas: ${error.message}</div>`;
            }
        }

        function exportResult(format) {
            if (!currentSessionId) {
                alert('No hay sesión para exportar');
                return;
            }
            window.open(`/api/export/${currentSessionId}/${format}`, '_blank');
        }
    </script>
</body>
</html>
